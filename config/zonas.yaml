# Catalogo de zonas de RapidGo (Bogota) para la variante 5 - Demanda por zonas.
#
# baseline_opm      : pedidos por minuto "normales" de la zona en hora pico (almuerzo/cena).
#                     Valores INICIALES de simulacion; se recalibran en la Semana 2 con
#                     el promedio real observado por Spark (candidato a ADR-002).
# repartidores_base : repartidores activos tipicos en la zona en hora pico. Se dimensiona para
#                     que en demanda normal la presion (pedidos 15 min / repartidores) sea ~0.7.
# tier              : A = alta demanda, B = media, C = baja. El producer usa estos pesos
#                     para generar trafico realista y picos.

zonas:
