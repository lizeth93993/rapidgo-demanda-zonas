# RapidGo - Variante 5: Demanda por zonas
# Kafka (KRaft) + topics + UI + producer + Spark Structured Streaming + Airflow.
#
#   docker compose up -d --build
#   docker compose logs -f spark             # [progreso] y [ALERTA]
#   docker compose logs -f producer          # mensajes confirmados por particion
#   UI de Kafka: http://localhost:8080 | UI de Airflow: http://localhost:8081

name: rapidgo-demanda

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: rapidgo-kafka
    user: root                                 # permisos de escritura sobre el volumen kafka-data
    volumes:
      - kafka-data:/var/lib/kafka/data         # los mensajes sobreviven a "docker compose down"
    ports:
      - "9092:9092"           # acceso desde el host (producer local, pruebas)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # el topic solo se crea con la config del ADR-001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: rapidgo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rapidgo.demanda.pedidos.v1 --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rapidgo.demanda.alertas.v1 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic rapidgo.demanda.pedidos.v1

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: rapidgo-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rapidgo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # --- Semana 2 -------------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: rapidgo-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      VELOCIDAD: ${VELOCIDAD:-10}            # segundos simulados por segundo real
      PICO_ZONA: ${PICO_ZONA:-}              # ej. PICO_ZONA=BOG-CHA docker compose up -d producer
      PICO_FACTOR: ${PICO_FACTOR:-2.5}
      REDUCIR_ZONA: ${REDUCIR_ZONA:-}        # ej. REDUCIR_ZONA=BOG-SUB
      DURACION: ${DURACION:-0}               # 0 = sin limite
      TASA_INVALIDOS: ${TASA_INVALIDOS:-0.01} # fraccion de eventos invalidos (fallo controlado: 0.3)
    restart: "no"

  spark:
    build: ./spark
    container_name: rapidgo-spark
    user: root                               # evita problemas de permisos al escribir en ./datalake
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./spark:/app/spark
      - ./config:/app/config:ro
      - ./datalake:/app/datalake
      - ivy-cache:/tmp/.ivy2
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --driver-memory
      - 2g
      - /app/spark/streaming_job.py
    restart: on-failure                      # si Spark se cae, Docker lo reinicia y sigue desde el checkpoint (ADR-003)

  # --- Semana 3 -------------------------------------------------------------
  airflow:
    build: ./airflow
    container_name: rapidgo-airflow
    command: standalone                      # api-server + scheduler + dag-processor en un contenedor
    ports:
      - "8081:8080"                          # UI de Airflow en http://localhost:8081 (8080 es Kafka UI)
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # sin login: solo para uso local
      RAPIDGO_DATALAKE: /opt/airflow/datalake
      RAPIDGO_CONFIG: /opt/airflow/config
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake
      - ./config:/opt/airflow/config:ro
    restart: "no"

volumes:
  kafka-data:
  ivy-cache:
